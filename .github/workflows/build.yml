name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Compute version
        id: ver
        run: |
          CODE=$((100 + $GITHUB_RUN_NUMBER))
          NAME="1.0.$GITHUB_RUN_NUMBER"
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Building version $NAME ($CODE)"

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signatures (V1/V2/V3)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          echo "=== APK 签名信息 ==="
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          $APKSIGNER verify --verbose --print-certs "$APK" || echo "验证失败（继续）"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/AutoSkip-${{ steps.ver.outputs.name }}.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoSkip-release-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          gh release create "$TAG" out/*.apk \
            --repo ${{ github.repository }} \
            --title "自动跳过 ${{ steps.ver.outputs.name }}" \
            --notes "自动构建：v${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})" \
            || gh release upload "$TAG" out/*.apk --clobber --repo ${{ github.repository }}
